name: Daily Contribution

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toggle activity file
        run: |
          if [ -f activity.log ]; then
            echo "Deleting activity.log"
            rm activity.log
          else
            echo "Creating activity.log"
            echo "$(date -u)" > activity.log
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "chore: daily contribution $(date +'%Y-%m-%d')" || exit 0

          git push
