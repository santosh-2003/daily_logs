name: Daily Contribution
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Toggle activity file
        run: |
          if [ -f activity.log ]; then
            echo "Deleting activity.log"
            rm activity.log
          else
            echo "Creating activity.log"
            echo "$(date -u)" > activity.log
          fi
      - name: Commit and push
        run: |
          git config user.name "santosh-2003"
          git config user.email "101939154+santosh-2003@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily contribution $(date +'%Y-%m-%d')" || exit 0
          git push
