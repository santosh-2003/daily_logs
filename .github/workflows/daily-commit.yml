name: Daily Contribution
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Make multiple commits
        run: |
          git config user.name "santosh-2003"
          git config user.email "101939154+santosh-2003@users.noreply.github.com"
          for i in {1..12}; do
            echo "$(date -u) - commit $i" >> activity.log
            git add activity.log
            git commit -m "chore: daily contribution $(date +'%Y-%m-%d') #$i"
          done
          git push
